name: macos

# Builds the app on macOS (Apple Silicon runner) with Homebrew's Qt, runs the tests and the offscreen
# smoke test, and uploads an unsigned app bundle as an artifact, so a Mac can try the current tree.
# The release workflow builds the same bundle for tags and attaches it to the release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macOS build and tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Homebrew packages
        run: brew install ninja qt libpng libmypaint libraw zstd pkg-config

      - name: Vendored OpenCV (cached)
        id: opencv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: opencv-prefix
          key: opencv-macos-14-${{ runner.arch }}-${{ hashFiles('tools/build-opencv.sh') }}
      - name: Build OpenCV
        if: steps.opencv.outputs.cache-hit != 'true'
        run: tools/build-opencv.sh opencv-prefix "$(sysctl -n hw.ncpu)"

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DOpenCV_DIR="$PWD/opencv-prefix/lib/cmake/opencv4" \
            -DCOMPOSITOR_VERSION="0.0.0-dev.${GITHUB_SHA::7}" \
            -DCOMPOSITOR_WITH_QTPDF=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Diagnose moc (on failure)
        if: failure()
        run: |
          cmake --version; brew list --versions qt qtbase qtpdf qtwebengine 2>/dev/null || true
          grep -i "PDF:\|Qt6_DIR\|Qt6Core_DIR" build/CMakeCache.txt || true
          ls build/src/app/nekophoto_autogen | head -20 || true
          head -40 build/src/app/nekophoto_autogen/mocs_compilation.cpp || true
          find build/src/app/nekophoto_autogen -name 'moc_*.cpp' | wc -l
          find build/src/app/nekophoto_autogen -name 'moc_Ruler*' -exec head -30 {} \; || true

      - name: Unit and golden tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test offscreen
        run: |
          app=build/src/app/NekoPhoto.app/Contents/MacOS/NekoPhoto
          QT_QPA_PLATFORM=offscreen "$app" --version
          QT_QPA_PLATFORM=offscreen "$app" --demo --screenshot demo.png --save-as Demo.comp
          "$app" --headless --rpc-socket "$PWD/rpc.sock" --demo &
          sleep 3
          COMPOSITOR_BIN="$app" python3 tools/rpc_smoke.py "$PWD/rpc.sock"
          kill %1

      - name: Bundle Qt and sign ad hoc
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/src/app/NekoPhoto.app -always-overwrite -verbose=1
          codesign --force --deep --sign - build/src/app/NekoPhoto.app
          ditto -c -k --sequesterRsrc --keepParent build/src/app/NekoPhoto.app "NekoPhoto-dev-macos-arm64.zip"
          shasum -a 256 NekoPhoto-dev-macos-arm64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: NekoPhoto-macos-arm64
          path: |
            NekoPhoto-dev-macos-arm64.zip
            demo.png

  # Qt PDF is off above while the macOS link failure (missing moc vtables since 1.5.0) is pinned down: this job builds
  # the app with it on, does not fail the workflow, and prints what moc produced.
  qtpdf-probe:
    name: macOS build with Qt PDF (probe)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Homebrew packages
        run: brew install ninja qt libpng libmypaint libraw zstd pkg-config
      - name: Configure and build the app only
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCOMPOSITOR_WITH_QTPDF=ON
          cmake --build build --target nekophoto -j"$(sysctl -n hw.ncpu)"

      - name: Diagnose moc (on failure)
        if: failure()
        run: |
          cmake --version; brew list --versions qt qtbase qtpdf qtwebengine 2>/dev/null || true
          grep -i "PDF:\|Qt6_DIR\|Qt6Core_DIR" build/CMakeCache.txt || true
          ls build/src/app/nekophoto_autogen | head -20 || true
          head -40 build/src/app/nekophoto_autogen/mocs_compilation.cpp || true
          find build/src/app/nekophoto_autogen -name 'moc_*.cpp' | wc -l
          find build/src/app/nekophoto_autogen -name 'moc_Ruler*' -exec head -30 {} \; || true
