name: release

# Pushing a tag like v0.2.0 builds compositor-linux, packages an AppImage and a
# plain tarball on Linux and an unsigned app bundle on macOS, and publishes them
# on a GitHub release with generated notes.
# "Run workflow" from the Actions tab does a dry run: the artifacts are built
# and attached to the workflow run only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage and tarball
    # 22.04's glibc keeps the AppImage runnable on distributions back to 2022.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpng-dev libmypaint-dev libsqlite3-dev libgl1-mesa-dev pkg-config \
            libfuse2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 file

      - name: Vendored OpenCV (cached)
        id: opencv
        uses: actions/cache@v4
        with:
          path: opencv-prefix
          key: opencv-ubuntu-22.04-${{ hashFiles('tools/build-opencv.sh') }}
      - name: Build OpenCV
        if: steps.opencv.outputs.cache-hit != 'true'
        run: tools/build-opencv.sh opencv-prefix

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          modules: "qtimageformats"
          cache: true

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCOMPOSITOR_VERSION="${{ steps.version.outputs.version }}" \
            -DCOMPOSITOR_WARNINGS_AS_ERRORS=ON \
            -DOpenCV_DIR="$PWD/opencv-prefix/lib/cmake/opencv4"
          cmake --build build -j"$(nproc)"

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          QT_QPA_PLATFORM=offscreen ./build/src/app/compositor-linux --version
          QT_QPA_PLATFORM=offscreen ./build/src/app/compositor-linux --demo --screenshot demo.png --save-as Demo.comp

      - name: Stage into an AppDir
        run: cmake --install build --prefix AppDir/usr

      - name: linuxdeploy
        run: |
          curl -sSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          export NO_STRIP=1   # linuxdeploy's bundled strip predates .relr.dyn sections
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export EXTRA_QT_MODULES="svg;waylandcompositor"
          # Qt 6.7 ships libqwayland-egl/-generic, newer Qt a single libqwayland; take whatever is there.
          plugins="$("$QMAKE" -query QT_INSTALL_PLUGINS)/platforms"
          # offscreen too, so the packaged app can be smoke-tested headless.
          export EXTRA_PLATFORM_PLUGINS="$(ls "$plugins" | grep -E '^libqwayland|^libqoffscreen' | paste -sd ';')"
          echo "Wayland plugins: $EXTRA_PLATFORM_PLUGINS"
          export LDAI_OUTPUT="compositor-linux-${{ steps.version.outputs.version }}-x86_64.AppImage"
          export LDAI_UPDATE_INFORMATION="gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|compositor-linux-*-x86_64.AppImage.zsync"
          ./linuxdeploy --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/compositor-linux.desktop \
            --icon-file packaging/compositor-linux.svg \
            --plugin qt
          # Ship the copyright file of every distribution package whose library was bundled.
          # Qt comes from aqtinstall, not dpkg; its licences are in LICENSES/ and THIRD-PARTY-NOTICES.md.
          bundled=AppDir/usr/share/doc/compositor-linux/bundled
          mkdir -p "$bundled"
          for lib in AppDir/usr/lib/*.so*; do
            pkg="$(dpkg -S "*/$(basename "$lib")" 2>/dev/null | head -n1 | cut -d: -f1)"
            if [ -n "$pkg" ] && [ -f "/usr/share/doc/$pkg/copyright" ]; then
              cp "/usr/share/doc/$pkg/copyright" "$bundled/$pkg.copyright"
            fi
          done
          ls "$bundled"
          ./linuxdeploy --appdir AppDir --output appimage
          ls -la *.AppImage*

      - name: Run the AppImage
        run: |
          chmod +x compositor-linux-*.AppImage
          QT_QPA_PLATFORM=offscreen ./compositor-linux-*.AppImage --appimage-extract-and-run --version
          QT_QPA_PLATFORM=offscreen ./compositor-linux-*.AppImage --appimage-extract-and-run --demo --screenshot appimage-demo.png

      - name: Tarball
        run: |
          v="${{ steps.version.outputs.version }}"
          rm -rf "compositor-linux-$v" && mkdir "compositor-linux-$v"
          cp -r AppDir/usr/bin AppDir/usr/share "compositor-linux-$v/"
          cp LICENSE THIRD-PARTY-NOTICES.md README.md "compositor-linux-$v/"
          tar czf "compositor-linux-$v-x86_64.tar.gz" "compositor-linux-$v"
          sha256sum *.AppImage *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: compositor-linux-${{ steps.version.outputs.version }}
          path: |
            *.AppImage
            *.AppImage.zsync
            *.tar.gz
            SHA256SUMS

  macos:
    name: macOS app bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Homebrew packages
        run: brew install ninja qt libpng libmypaint pkg-config

      - name: Vendored OpenCV (cached)
        id: opencv
        uses: actions/cache@v4
        with:
          path: opencv-prefix
          key: opencv-macos-14-${{ runner.arch }}-${{ hashFiles('tools/build-opencv.sh') }}
      - name: Build OpenCV
        if: steps.opencv.outputs.cache-hit != 'true'
        run: tools/build-opencv.sh opencv-prefix "$(sysctl -n hw.ncpu)"

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DOpenCV_DIR="$PWD/opencv-prefix/lib/cmake/opencv4" \
            -DCOMPOSITOR_VERSION="${{ steps.version.outputs.version }}"
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Tests and smoke test
        run: |
          ctest --test-dir build --output-on-failure
          app=build/src/app/compositor-linux.app/Contents/MacOS/compositor-linux
          QT_QPA_PLATFORM=offscreen "$app" --version
          QT_QPA_PLATFORM=offscreen "$app" --demo --screenshot demo.png --save-as Demo.comp

      - name: Bundle Qt, sign ad hoc, zip
        run: |
          v="${{ steps.version.outputs.version }}"
          "$(brew --prefix qt)/bin/macdeployqt" build/src/app/compositor-linux.app -always-overwrite -verbose=1
          codesign --force --deep --sign - build/src/app/compositor-linux.app
          ditto -c -k --sequesterRsrc --keepParent build/src/app/compositor-linux.app "compositor-linux-$v-macos-arm64.zip"
          shasum -a 256 "compositor-linux-$v-macos-arm64.zip" > SHA256SUMS-macos

      - uses: actions/upload-artifact@v4
        with:
          name: compositor-linux-${{ steps.version.outputs.version }}-macos
          path: |
            compositor-linux-*-macos-arm64.zip
            SHA256SUMS-macos

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: compositor-linux-*
          merge-multiple: true
      - name: Combined checksums
        run: |
          cat SHA256SUMS SHA256SUMS-macos > SHA256SUMS.all && mv SHA256SUMS.all SHA256SUMS && rm SHA256SUMS-macos
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: compositor-linux ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            *.AppImage
            *.AppImage.zsync
            *.tar.gz
            *.zip
            SHA256SUMS
