name: release

# Pushing a tag like v0.2.0 builds NekoPhoto, packages an AppImage and a
# plain tarball on Linux and a portable zip on Windows, and publishes them on a
# GitHub release with generated notes.
# "Run workflow" from the Actions tab does a dry run: the artifacts are built
# and attached to the workflow run only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read   # only the release job, which publishes, can write

jobs:
  appimage:
    name: AppImage and tarball
    # 22.04's glibc keeps the AppImage runnable on distributions back to 2022.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libpng-dev libmypaint-dev libraw-dev libzstd-dev libsqlite3-dev libgl1-mesa-dev pkg-config \
            libfuse2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 file

      - name: Vendored OpenCV (cached)
        id: opencv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: opencv-prefix
          key: opencv-ubuntu-22.04-${{ hashFiles('tools/build-opencv.sh') }}
      - name: Build OpenCV
        if: steps.opencv.outputs.cache-hit != 'true'
        run: tools/build-opencv.sh opencv-prefix

      - name: Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125   # v4
        with:
          version: "6.7.3"
          modules: "qtimageformats qtpdf"
          cache: true

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCOMPOSITOR_VERSION="${{ steps.version.outputs.version }}" \
            -DCOMPOSITOR_WARNINGS_AS_ERRORS=ON \
            -DOpenCV_DIR="$PWD/opencv-prefix/lib/cmake/opencv4"
          cmake --build build -j"$(nproc)"

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          QT_QPA_PLATFORM=offscreen ./build/src/app/nekophoto --version
          QT_QPA_PLATFORM=offscreen ./build/src/app/nekophoto --demo --screenshot demo.png --save-as Demo.comp

      - name: AppImage
        run: tools/package-appimage.sh build "${{ steps.version.outputs.version }}"

      - name: Run the AppImage
        run: |
          chmod +x NekoPhoto-*.AppImage
          QT_QPA_PLATFORM=offscreen ./NekoPhoto-*.AppImage --appimage-extract-and-run --version
          QT_QPA_PLATFORM=offscreen ./NekoPhoto-*.AppImage --appimage-extract-and-run --demo --screenshot appimage-demo.png

      - name: Updates for compositor-linux AppImages
        # Until 1.0 the AppImage was compositor-linux-<version>, and those look for compositor-linux-*.zsync in the
        # latest release. The same zsync under that name (its URL is the NekoPhoto AppImage, relative) moves them over.
        run: |
          v="${{ steps.version.outputs.version }}"
          if [ -f "NekoPhoto-$v-x86_64.AppImage.zsync" ]; then
            cp "NekoPhoto-$v-x86_64.AppImage.zsync" "compositor-linux-$v-x86_64.AppImage.zsync"
          fi

      - name: Tarball
        run: |
          v="${{ steps.version.outputs.version }}"
          rm -rf "NekoPhoto-$v" && mkdir "NekoPhoto-$v"
          cp -r AppDir/usr/bin AppDir/usr/share "NekoPhoto-$v/"
          cp LICENSE THIRD-PARTY-NOTICES.md README.md "NekoPhoto-$v/"
          tar czf "NekoPhoto-$v-x86_64.tar.gz" "NekoPhoto-$v"
          sha256sum *.AppImage *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: NekoPhoto-${{ steps.version.outputs.version }}
          path: |
            *.AppImage
            *.AppImage.zsync
            *.tar.gz
            *.zip
            *.zip.sha256
            SHA256SUMS

  windows:
    name: Windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e   # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            curl zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p python:p
            qt6-base:p qt6-svg:p qt6-imageformats:p qt6-tools:p qt6-translations:p
            libpng:p zlib:p libmypaint:p libraw:p zstd:p sqlite3:p
      - name: Version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Vendored OpenCV (cached)
        id: opencv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: opencv-prefix
          key: opencv-windows-ucrt64-${{ hashFiles('tools/build-opencv.sh') }}
      - name: Build OpenCV
        if: steps.opencv.outputs.cache-hit != 'true'
        run: tools/build-opencv.sh opencv-prefix

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCOMPOSITOR_VERSION="${{ steps.version.outputs.version }}" \
            -DCOMPOSITOR_WARNINGS_AS_ERRORS=ON \
            -DOpenCV_DIR="$PWD/opencv-prefix"
          cmake --build build -j"$(nproc)"

      - name: Tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Zip
        run: |
          v="${{ steps.version.outputs.version }}"
          tools/package-windows.sh build "$v"
          (cd "NekoPhoto-$v-windows-x86_64" && PATH="/c/Windows/System32:/c/Windows" ./nekophoto.exe --version \
            && PATH="/c/Windows/System32:/c/Windows" QT_QPA_PLATFORM=offscreen ./nekophoto.exe --demo --screenshot ../zip-demo.png)
          sha256sum "NekoPhoto-$v-windows-x86_64.zip" > "NekoPhoto-$v-windows-x86_64.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: NekoPhoto-${{ steps.version.outputs.version }}-windows
          path: |
            NekoPhoto-*-windows-x86_64.zip
            NekoPhoto-*-windows-x86_64.zip.sha256

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # creates the release and uploads the files
    steps:
      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          pattern: NekoPhoto-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          name: NekoPhoto ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            *.AppImage
            *.AppImage.zsync
            *.tar.gz
            *.zip
            *.zip.sha256
            SHA256SUMS
